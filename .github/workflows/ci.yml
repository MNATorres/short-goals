name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Builds every module: compiles, runs unit tests and assembles the app.
      # GitHub's ubuntu runners ship with the Android SDK preinstalled.
      - run: ./gradlew build

      # The installable debug APK, downloadable from each run's Artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: short-goals-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
