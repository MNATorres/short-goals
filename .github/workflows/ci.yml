name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run it obsoletes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # build compiles every module, runs unit tests, detekt and Android
      # Lint (Kotlin warnings are errors); koverVerify enforces the :core
      # coverage floor. GitHub's ubuntu runners ship with the Android SDK.
      - run: ./gradlew build :core:koverVerify

      # The installable debug APK, downloadable from each run's Artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: short-goals-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # On failure, keep every test/lint/detekt report for diagnosis.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: '**/build/reports/**'
